name: ci
on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The engine must build with no OS APIs at all.
      - run: cargo build -p cfx-engine --target wasm32-unknown-unknown
      - run: cargo run --release -p cfx-eval -- run --iters 20

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p cfx-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: clickfixed-windows-x86_64
          path: target/release/clickfixed.exe
