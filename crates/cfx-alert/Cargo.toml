[package]
name = "cfx-alert"
description = "clickfixed alert schema (ECS), severity mapping, and outputs (stdout, file, syslog/CEF, webhook, Jira)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cfx-engine.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true
tracing.workspace = true
regex = "1"
base64 = "0.22"
gethostname = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

# HTTP outputs. rustls on Unix; on Windows the system TLS stack (SChannel) and the Windows
# certificate store, so corporate TLS inspection roots are honoured.
[target.'cfg(not(windows))'.dependencies]
ureq = "3"

[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls-no-default", "gzip"] }

[dev-dependencies]
csv.workspace = true
