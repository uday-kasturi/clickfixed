[package]
name = "cfx-engine"
description = "OS-independent ClickFix detection engine: features, scoring, deobfuscation, allowlist."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# INVARIANT: no OS-specific dependencies in this crate, ever.
# CI builds it for wasm32-unknown-unknown to enforce that.
[dependencies]
serde.workspace = true
toml.workspace = true
tracing.workspace = true
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
percent-encoding = "2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
criterion = "0.8"
serde_json.workspace = true

[[bench]]
name = "fast_path"
harness = false
