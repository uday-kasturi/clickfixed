[package]
name = "cfx-daemon"
description = "clickfixed endpoint daemon: wires collectors to the engine; warn/block."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "clickfixed"
path = "src/main.rs"

[dependencies]
cfx-engine.workspace = true
cfx-collect.workspace = true
cfx-alert.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

# Windows end-to-end test driver (examples/windows_e2e.rs): synthetic keystrokes and
# clipboard reads.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
] }
